<title>FRANQ QUIZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try{var s=JSON.parse(localStorage.getItem('franqQuizV3'));var t=s&&s.settings&&s.settings.theme;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
<style>
@font-face{font-family:'Nibpro';src:url('assets/fonts/nib-semibold-pro.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
/* ===== LIGHT (default) — Franq site-kit derived ===== */
/* surfaces */
--bg:#F5F7FB;--bg-deep:#EAEDF7;--card:#FFFFFF;--card-2:#EEF0F8;
--glass:rgba(19,28,37,0.04);--glass-strong:rgba(19,28,37,0.08);
--glass-chip:rgba(104,123,234,0.08);--glass-nav:rgba(245,247,251,0.82);--glass-border:rgba(19,28,37,0.10);
--border:#E4E6F2;--border-soft:#EEF0F8;
--track:rgba(19,28,37,0.08);--dot:rgba(19,28,37,0.16);
/* brand */
--primary:#687BEA;--primary-soft:#4A5BD0;--primary-deep:#3B4794;
--primary-ring:rgba(104,123,234,0.28);--primary-glow:rgba(104,123,234,0.14);
--lima:#DCFF79;--lima-bg:rgba(220,255,121,0.32);--lima-ink:#4D5A16;
/* semantic */
--ok:#06A37A;--ok-text:#06A37A;--ok-bg:rgba(6,163,122,0.12);
--warn:#E6952B;--warn-text:#B26A12;--warn-bg:rgba(230,149,43,0.14);
--danger:#DC2F5B;--danger-text:#C42A54;--danger-bg:rgba(220,47,91,0.10);
/* text */
--text:#131C25;--text-sec:#495057;--text-ter:#6B7480;
/* legacy aliases (kept so any un-migrated reference still resolves to the new palette) */
--accent:#687BEA;--accent-light:#4A5BD0;--success:#06A37A;--gold:#B26A12;--flame:#E6952B;
--card-border:#E4E6F2;
/* type (theme-agnostic) */
--font-serif:'Nibpro','DM Serif Display',Georgia,serif;
--font-sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
--font-display:'Nibpro','DM Serif Display',Georgia,serif;
/* shape (theme-agnostic) */
--r-card:20px;--r-btn:16px;--r-lg:24px;--r-pill:999px;--r-chip:12px;
--r-giant:22px 22px 22px 64px;
/* motion (theme-agnostic) */
--ease:cubic-bezier(0.4,0,0.2,1);--ease-enter:cubic-bezier(0,0,0.2,1);--ease-exit:cubic-bezier(0.4,0,1,1);
--ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}
:root[data-theme="dark"]{
/* ===== DARK ===== */
/* surfaces */
--bg:#131C25;--bg-deep:#0E1014;--card:#1E2738;--card-2:#2E3944;
--glass:rgba(255,255,255,0.06);--glass-strong:rgba(255,255,255,0.10);
--glass-chip:rgba(46,57,68,0.45);--glass-nav:rgba(14,18,26,0.82);--glass-border:rgba(255,255,255,0.12);
--border:rgba(255,255,255,0.09);--border-soft:rgba(255,255,255,0.05);
--track:rgba(255,255,255,0.06);--dot:rgba(255,255,255,0.14);
/* brand */
--primary:#687BEA;--primary-soft:#8B9BFF;--primary-deep:#45529C;
--primary-ring:rgba(104,123,234,0.35);--primary-glow:rgba(104,123,234,0.20);
--lima:#DCFF79;--lima-bg:rgba(220,255,121,0.14);--lima-ink:#DCFF79;
/* semantic */
--ok:#06A37A;--ok-text:#4ADBB5;--ok-bg:rgba(6,163,122,0.16);
--warn:#E6952B;--warn-text:#F2B45C;--warn-bg:rgba(230,149,43,0.15);
--danger:#DC2F5B;--danger-text:#F4779A;--danger-bg:rgba(220,47,91,0.15);
/* text */
--text:#F5F7FA;--text-sec:#C7D2DE;--text-ter:#93A0B0;
/* legacy aliases */
--accent:#687BEA;--accent-light:#8B9BFF;--success:#06A37A;--gold:#F2B45C;--flame:#E6952B;
--card-border:rgba(255,255,255,0.09);
}
html,body{
font-family:var(--font-sans);background:var(--bg);color:var(--text);
overflow-x:hidden;-webkit-tap-highlight-color:transparent;
height:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body{display:flex;justify-content:center;min-height:100%;-webkit-touch-callout:none;transition:background-color .25s ease,color .25s ease}
::-webkit-scrollbar{display:none}
#app{
width:100%;max-width:390px;position:relative;min-height:100vh;min-height:100dvh;
overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0);touch-action:manipulation;
background-image:radial-gradient(ellipse 80% 50% at 20% -5%,rgba(104,123,234,0.14) 0%,transparent 60%),radial-gradient(ellipse 70% 40% at 90% 105%,rgba(139,155,255,0.07) 0%,transparent 60%);
}
.screen{
display:none;flex-direction:column;position:absolute;inset:0;
overflow-y:auto;overflow-x:hidden;padding:20px;padding-top:calc(env(safe-area-inset-top,20px) + 12px);
}
.screen.active{display:flex;animation:screenIn .28s var(--ease-enter) both}
.screen.with-nav{padding-bottom:96px}
:focus-visible{outline:2px solid var(--primary-soft);outline-offset:2px}
button:focus-visible,input:focus-visible,a:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary-soft);outline-offset:2px}
button{
font-family:var(--font-sans);border:none;cursor:pointer;color:var(--text);
-webkit-user-select:none;user-select:none;transition:transform 150ms var(--ease),opacity 150ms var(--ease),background 150ms var(--ease);
touch-action:manipulation;min-height:44px;
}
button:active{transform:scale(0.97)}
input{
font-family:var(--font-sans);width:100%;padding:15px 18px;
background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);
color:var(--text);font-size:15px;outline:none;transition:border-color 200ms var(--ease),box-shadow 200ms var(--ease);min-height:50px;
}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
input::placeholder{color:var(--text-ter)}

/* ===== type helpers ===== */
.serif{font-family:var(--font-serif);font-weight:500;letter-spacing:-0.01em}
.eyebrow{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--primary-soft)}
.num{font-family:var(--font-serif);font-weight:500;font-feature-settings:'tnum' 1;letter-spacing:-0.01em}

/* ===== buttons ===== */
.btn-primary{
width:100%;padding:16px;border-radius:var(--r-pill);font-weight:600;font-size:16px;
background:var(--primary);color:#fff;letter-spacing:0.2px;
display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:active{background:var(--primary-deep)}
.btn-primary svg{width:18px;height:18px;stroke:currentColor;fill:none}
.btn-secondary{
padding:14px 20px;border-radius:var(--r-pill);font-weight:600;font-size:14px;
background:var(--glass);color:var(--text);border:1px solid var(--glass-border);
display:inline-flex;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.btn-secondary:active{background:var(--glass-strong)}
.btn-secondary svg{width:16px;height:16px;stroke:currentColor;fill:none}
.btn-danger{
width:100%;padding:15px;border-radius:var(--r-pill);
background:var(--danger-bg);color:var(--danger-text);font-weight:700;font-size:15px;margin-top:8px;border:1px solid transparent;
}
.btn-danger:active{background:rgba(220,47,91,0.24)}
.btn-feedback{
width:100%;padding:15px;border-radius:var(--r-pill);
background:var(--glass);border:1px solid var(--glass-border);color:var(--text);font-weight:600;font-size:15px;
display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-feedback svg{width:16px;height:16px;stroke:currentColor;fill:none}
/* generic icon chip (header actions, etc) */
.icon-chip{
width:42px;height:42px;border-radius:14px;background:var(--glass-chip);border:1px solid var(--glass-border);
display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;color:var(--text-sec);
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-shrink:0;
}
.icon-chip svg{width:19px;height:19px;stroke:currentColor;fill:none}
.icon-chip:active{background:var(--glass-strong)}

.card{
background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:18px;
}
.gradient-text{color:var(--primary-soft)}

/* ===== keyframes ===== */
@keyframes screenIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bounceIn{0%{opacity:0;transform:scale(0.7)}55%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes comboBounce{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:scale(1)}}
@keyframes springBounce{0%{transform:scale(0.6)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes timerPulse{0%,100%{box-shadow:0 0 8px rgba(220,47,91,0.35)}50%{box-shadow:0 0 22px rgba(220,47,91,0.65)}}
@keyframes answerShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes answerPop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes roundOverlay{0%{opacity:0;transform:scale(0.6)}45%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes countUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes glowPulse{0%,100%{opacity:0.25;transform:scale(1)}50%{opacity:0.5;transform:scale(1.1)}}
@keyframes particleDrift{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:0.22}88%{opacity:0.22}100%{opacity:0;transform:translateY(-100vh) rotate(160deg)}}
/* ===== game-feel fx ===== */
@keyframes countdownPop{0%{transform:scale(0.5)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pointsFloat{0%{opacity:0;transform:translate(-50%,0) scale(0.8)}18%{opacity:1;transform:translate(-50%,-8px) scale(1)}100%{opacity:0;transform:translate(-50%,-48px) scale(1)}}
@keyframes fxFlash{0%{opacity:0}25%{opacity:.35}100%{opacity:0}}
@keyframes comboGlow{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes chipPop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes perfectFlash{0%{opacity:0;transform:scale(0.6)}25%{opacity:1;transform:scale(1.08)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.points-float{position:fixed;pointer-events:none;z-index:350;font-family:var(--font-serif);font-weight:500;font-size:30px;color:var(--primary-soft);text-shadow:0 2px 12px rgba(0,0,0,0.5);animation:pointsFloat .8s var(--ease-enter) forwards;will-change:transform,opacity}
.points-float.big{color:var(--lima-ink)}
.fx-flash{position:fixed;inset:0;pointer-events:none;z-index:350;opacity:0;animation:fxFlash .5s var(--ease) forwards}
.fx-flash.correct{background:radial-gradient(circle at 50% 55%,rgba(6,163,122,0.55),transparent 65%)}
.fx-flash.wrong{background:radial-gradient(circle at 50% 55%,rgba(220,47,91,0.5),transparent 65%)}
.combo-glow{position:fixed;inset:0;pointer-events:none;z-index:350;opacity:0;box-shadow:inset 0 0 60px rgba(139,155,255,0.85);animation:comboGlow .6s var(--ease) forwards}
.combo-glow.hot{box-shadow:inset 0 0 70px rgba(220,255,121,0.9)}
.answer-btn.correct .letter{animation:chipPop .35s var(--ease-spring)}
.perfect-flash{position:fixed;inset:0;z-index:950;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--font-serif);font-weight:500;font-size:52px;color:var(--lima-ink);text-shadow:0 4px 24px rgba(0,0,0,0.55);animation:perfectFlash 1.2s var(--ease) forwards}
.anim-fiu{animation:fadeInUp .42s var(--ease-enter) both;will-change:transform,opacity}
.anim-fi{animation:fadeIn .3s var(--ease-enter) both}
.anim-bi{animation:bounceIn .5s var(--ease-spring) both}
.anim-sir{animation:slideInRight .35s var(--ease-enter) both}
.anim-sil{animation:slideInLeft .35s var(--ease-enter) both}
.answers .anim-fiu{animation-duration:.3s}
.topics-grid-home .anim-fiu:nth-child(1),.topics-grid .anim-fiu:nth-child(1){animation-delay:0s}
.topics-grid-home .anim-fiu:nth-child(2),.topics-grid .anim-fiu:nth-child(2){animation-delay:.04s}
.topics-grid-home .anim-fiu:nth-child(3),.topics-grid .anim-fiu:nth-child(3){animation-delay:.08s}
.topics-grid-home .anim-fiu:nth-child(4),.topics-grid .anim-fiu:nth-child(4){animation-delay:.12s}
.topics-grid-home .anim-fiu:nth-child(5),.topics-grid .anim-fiu:nth-child(5){animation-delay:.16s}
.topics-grid-home .anim-fiu:nth-child(6),.topics-grid .anim-fiu:nth-child(6){animation-delay:.2s}
.topics-grid .anim-fiu:nth-child(7){animation-delay:.24s}
.topics-grid .anim-fiu:nth-child(8){animation-delay:.28s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ===== splash ===== */
#splash{justify-content:center;align-items:center;gap:22px;background:radial-gradient(ellipse 70% 45% at 50% 38%,rgba(104,123,234,0.16) 0%,transparent 68%)}
.splash-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.splash-particle{position:absolute;opacity:0;animation:particleDrift linear infinite;will-change:transform,opacity}
.splash-logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:120px;height:120px}
.splash-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--lima);box-shadow:0 0 18px rgba(220,255,121,0.28),inset 0 0 14px rgba(220,255,121,0.10);animation:ringPulse 2.2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.06);opacity:0.9}}
.splash-logo{
width:96px;height:96px;border-radius:22px 22px 22px 40px;background:var(--card);border:1px solid var(--glass-border);
display:flex;align-items:center;justify-content:center;color:var(--primary-soft);
box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:logoEntrance .8s var(--ease-spring) both;position:relative;z-index:1;
}
.splash-logo svg{width:52px;height:52px}
.splash-logo-glow{position:absolute;inset:-10px;border-radius:26px;background:var(--primary);z-index:-1;filter:blur(22px);opacity:0;animation:glowPulse 2.4s ease-in-out infinite .8s;pointer-events:none}
@keyframes logoEntrance{0%{opacity:0;transform:scale(0.5) rotate(-12deg)}70%{opacity:1;transform:scale(1.06) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.splash-title{font-family:var(--font-serif);font-weight:500;font-size:44px;letter-spacing:-0.01em;text-align:center;display:flex;justify-content:center;align-items:center;min-height:52px;color:var(--text)}
.splash-title .letter{display:inline-block;opacity:0;animation:letterPop .38s var(--ease-spring) both}
.splash-title .letter.accent{color:var(--primary-soft)}
.splash-title .letter.space{width:12px}
@keyframes letterPop{0%{opacity:0;transform:translateY(16px) scale(0.5)}70%{transform:translateY(-2px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}
.splash-tagline{font-size:14px;color:var(--text-sec);font-weight:400;letter-spacing:0.3px;opacity:0;animation:fadeInUp .5s var(--ease-enter) .9s both}
.splash-bar-wrap{width:200px;height:4px;background:var(--track);border-radius:4px;overflow:hidden;opacity:0;animation:fadeIn .3s var(--ease) 1s both}
.splash-footer{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 30px);text-align:center;font-size:12px;color:var(--text-ter);letter-spacing:0.02em;opacity:0;animation:fadeIn .5s var(--ease) 1.2s both}
.splash-footer strong{color:var(--primary-soft);font-weight:600}
.splash-bar{height:100%;width:0;border-radius:4px;background:var(--lima);box-shadow:0 0 12px rgba(220,255,121,0.5);transition:width .1s linear}

/* ===== login ===== */
#login{justify-content:center;gap:16px;padding:40px 24px}
.login-logo{text-align:center;margin-bottom:8px}
.login-logo-icon{width:66px;height:66px;border-radius:20px 20px 20px 30px;margin:0 auto 14px;background:var(--card);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;color:var(--primary-soft)}
.login-logo-icon svg{width:34px;height:34px}
.login-eyebrow{text-align:center;margin-bottom:6px}
.login-title{font-family:var(--font-serif);font-weight:500;font-size:28px;text-align:center;margin-bottom:6px;letter-spacing:-0.01em}
.login-sub{text-align:center;color:var(--text-sec);font-size:13px;margin-bottom:12px}
.login-field{margin-bottom:4px}
.login-field label{display:block;font-size:11px;font-weight:600;color:var(--text-sec);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.06em}
.login-error{color:var(--danger-text);font-size:12px;min-height:18px;margin-top:4px}
.login-toggle-link{background:none;border:none;color:var(--primary-soft);font-size:13px;font-weight:600;margin-top:12px;cursor:pointer;width:100%;text-align:center}

/* ===== home ===== */
#home{gap:16px;padding-bottom:104px}
.home-header{display:flex;align-items:center;justify-content:space-between}
.home-profile{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:none;padding:0;text-align:left}
.avatar{
width:48px;height:48px;border-radius:50%;background:var(--card);
display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
overflow:hidden;border:2px solid var(--primary);
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.sm{width:38px;height:38px;font-size:16px;border-width:0}
.avatar.lg{width:66px;height:66px;font-size:30px;border-width:2px}
.avatar.xl{width:84px;height:84px;font-size:38px;border-width:2.5px}
.avatar.no-ring{border:none}
.home-name{font-family:var(--font-serif);font-weight:500;font-size:19px;letter-spacing:-0.01em}
.home-role{font-size:11px;color:var(--text-ter);margin-top:1px}
.rank-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:600;background:var(--glass);border:1px solid var(--border);margin-top:3px}
.home-actions{display:flex;align-items:center;gap:10px}

/* play cards (CSS, no PNGs) */
.play-buttons{display:flex;gap:12px}
.play-btn{
flex:1;border:none;padding:0;position:relative;overflow:hidden;
border-radius:var(--r-card);aspect-ratio:1/0.92;text-align:left;
display:flex;flex-direction:column;justify-content:flex-end;
}
.play-btn.primary{background:var(--primary);border-radius:var(--r-giant)}
.play-btn.ghost{background:var(--card);border:1px solid var(--border)}
.play-btn .play-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;height:100%;text-align:center}
.play-btn .play-icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-bottom:2px;color:#fff}
.play-btn.ghost .play-icon{color:var(--primary-soft)}
.play-btn .play-icon svg{width:26px;height:26px;stroke:currentColor;fill:none}
.play-btn .play-label{font-family:var(--font-serif);font-weight:500;font-size:22px;letter-spacing:-0.01em;color:#fff}
.play-btn.ghost .play-label{color:var(--text)}
.play-btn .play-sub{font-size:11px;font-weight:400;color:rgba(255,255,255,0.75)}
.play-btn.ghost .play-sub{color:var(--text-ter)}
.play-btn .play-watermark{position:absolute;right:-14px;top:-14px;width:96px;height:96px;opacity:0.14;color:#fff;pointer-events:none}
.play-btn .play-watermark svg{width:100%;height:100%}
.play-btn:active{transform:scale(0.97)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--primary-soft);display:flex;align-items:center;gap:6px;margin-bottom:0}
.section-link{font-size:12px;font-weight:600;color:var(--text-sec);cursor:pointer;background:none;border:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}

.topics-grid-home{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.topic-card-home{
border-radius:var(--r-chip);text-align:center;position:relative;overflow:hidden;cursor:pointer;
background:var(--card);border:1px solid var(--border);
display:flex;flex-direction:column;align-items:center;padding:0;aspect-ratio:1/0.98;
transition:transform 150ms var(--ease),border-color 150ms var(--ease),background 150ms var(--ease);
}
.topic-card-home .topic-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:100%;padding:10px 4px}
.topic-card-home .topic-icon-img{width:34px;height:34px;object-fit:contain}
.topic-card-home .topic-name{font-size:10px;font-weight:600;color:var(--text-sec);line-height:1.2}
.topic-card-home:active{transform:scale(0.95);border-color:var(--primary-ring)}

.mission-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.mission-item:last-child{border-bottom:none}
.mission-icon{flex-shrink:0;color:var(--primary-soft);display:flex}
.mission-icon svg{width:20px;height:20px;stroke:currentColor;fill:none}
.mission-info{flex:1;min-width:0}
.mission-name{font-size:13px;font-weight:600}
.mission-prog-bar{height:5px;background:var(--track);border-radius:4px;margin-top:5px;overflow:hidden}
.mission-prog-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .3s}
.mission-val{font-family:var(--font-serif);font-size:12px;color:var(--text-sec);font-weight:500;flex-shrink:0}

.ranking-list{display:flex;flex-direction:column;gap:0}
.ranking-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.ranking-row:last-child{border-bottom:none}
.ranking-pos{width:18px;font-family:var(--font-serif);font-size:14px;font-weight:500;color:var(--text-ter);text-align:center;flex-shrink:0}
.ranking-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--card-2);border:none}
.ranking-avatar img{width:100%;height:100%;object-fit:cover}
.ranking-info{flex:1;min-width:0}
.ranking-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranking-role{font-size:10px;color:var(--text-ter);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranking-score{font-family:var(--font-serif);font-size:15px;font-weight:500;color:var(--primary-soft);flex-shrink:0;min-width:38px;text-align:right}
.ranking-challenge-btn{padding:7px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:700;background:var(--glass);border:1px solid var(--glass-border);color:var(--primary-soft);cursor:pointer;flex-shrink:0;min-height:34px}
.ranking-challenge-btn:active{transform:scale(0.95);background:var(--glass-strong)}
.ranking-row.me{background:var(--primary-glow);border-radius:var(--r-chip);padding:10px 10px;margin:0 -10px;border-bottom-color:transparent}

/* ===== topics ===== */
#topics{gap:18px}
.topics-header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.back-btn{
width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);
display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none}
.screen-title{font-family:var(--font-serif);font-weight:500;font-size:26px;letter-spacing:-0.01em}
.topics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.topic-card{
text-align:center;position:relative;overflow:hidden;cursor:pointer;
background:var(--card);border:1px solid var(--border);border-radius:var(--r-chip);
display:flex;flex-direction:column;align-items:center;padding:0;aspect-ratio:1/0.98;
transition:transform 150ms var(--ease),border-color 150ms var(--ease);
}
.topic-card .topic-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:100%;padding:10px 4px}
.topic-card:active{transform:scale(0.95);border-color:var(--primary-ring)}
.topic-card .topic-icon-img{width:38px;height:38px;object-fit:contain}
.topic-card .topic-icon{font-size:34px}
.topic-card .topic-name{font-size:11px;font-weight:600;color:var(--text-sec);line-height:1.2}
.topic-card .topic-meta{font-family:var(--font-serif);font-size:10px;color:var(--text-ter)}

/* ===== matchmaking ===== */
#matchmaking{justify-content:center;align-items:center;gap:24px}
.match-topic{font-size:12px;font-weight:600;color:var(--primary-soft);text-transform:uppercase;letter-spacing:0.08em}
.match-vs{display:flex;align-items:center;gap:24px;margin:20px 0}
.match-player{text-align:center}
.match-player .avatar{margin:0 auto 10px}
.match-player-name{font-size:14px;font-weight:700}
.match-player-role{font-size:11px;color:var(--text-ter)}
.vs-text{font-family:var(--font-serif);font-weight:500;font-size:30px;color:var(--primary-soft)}
.match-status{font-size:15px;font-weight:600;color:var(--text-sec);text-align:center}
.match-countdown{font-family:var(--font-serif);font-weight:500;font-size:76px;color:var(--primary-soft);animation:countdownPop .4s var(--ease-spring)}
.match-cancel{padding:13px 32px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--glass-border);color:var(--text-sec);font-weight:600;font-size:14px}

/* ===== gameplay ===== */
#gameplay{gap:8px;padding:12px 16px;padding-top:calc(env(safe-area-inset-top,14px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0) + 14px);touch-action:manipulation;background:var(--bg-deep)}
.game-topbar{display:flex;align-items:center;justify-content:space-between}
.game-topic{font-size:11px;font-weight:600;color:var(--primary-soft);text-transform:uppercase;letter-spacing:0.06em;display:flex;align-items:center;gap:5px}
.game-topic svg{width:14px;height:14px;stroke:currentColor;fill:none}
.game-round{font-family:var(--font-serif);font-size:14px;font-weight:500}
.game-quit{padding:7px 15px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--glass-border);color:var(--text-sec);font-size:12px;font-weight:600;min-height:36px}
.game-scores{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.game-player{display:flex;align-items:center;gap:8px}
.game-player.right{flex-direction:row-reverse}
.game-player-name{font-size:12px;font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game-player-score{font-family:var(--font-serif);font-size:18px;font-weight:500}
.score-bar-wrap{height:5px;background:var(--track);border-radius:4px;overflow:hidden;margin-bottom:4px;display:flex}
.score-bar-left{height:100%;background:var(--primary);transition:width .4s;border-radius:4px 0 0 4px}
.score-bar-right{height:100%;background:var(--primary-soft);transition:width .4s;border-radius:0 4px 4px 0}
.timer-bar-wrap{height:6px;background:var(--track);border-radius:6px;overflow:hidden;position:relative}
.timer-bar{height:100%;border-radius:6px;transition:background .3s;will-change:width}
.timer-bar.green{background:var(--ok)}
.timer-bar.yellow{background:var(--warn)}
.timer-bar.red{background:var(--danger)}
.timer-bar-wrap.timer-danger{animation:timerPulse 0.5s ease infinite}
.timer-number{font-family:var(--font-serif);text-align:center;font-size:24px;font-weight:500;margin:2px 0;transition:color .3s}
.timer-number.green{color:var(--ok-text)}
.timer-number.yellow{color:var(--warn-text)}
.timer-number.red{color:var(--danger-text)}
.question-text{font-size:16px;font-weight:600;line-height:1.4;text-align:center;min-height:44px;padding:6px 0;color:var(--text);flex:0 0 auto}
.answers{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.answer-btn{
width:100%;padding:13px 14px;border-radius:var(--r-btn);background:var(--card);
border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;
text-align:left;display:flex;align-items:center;gap:10px;transition:transform 200ms var(--ease),border-color 200ms var(--ease),background 200ms var(--ease),opacity 200ms var(--ease);
min-height:48px;line-height:1.3;
}
.answer-btn:active:not(.correct):not(.wrong):not(.dimmed){transform:scale(0.98);border-color:var(--primary)}
.answer-btn .letter{
width:26px;height:26px;border-radius:8px;background:var(--glass-chip);
display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
flex-shrink:0;transition:background 200ms var(--ease),color 200ms var(--ease);
}
.answer-btn.correct{background:var(--ok-bg);border-color:var(--ok);animation:answerPop .3s var(--ease-spring)}
.answer-btn.correct .letter{background:var(--ok);color:#fff}
.answer-btn.wrong{background:var(--danger-bg);border-color:var(--danger);animation:answerShake .35s var(--ease)}
.answer-btn.wrong .letter{background:var(--danger);color:#fff}
.answer-btn.dimmed{opacity:0.3;pointer-events:none}
.answer-btn.removed{display:none}
.explanation-card{
margin-top:8px;padding:12px 16px;border-radius:var(--r-btn);
background:var(--glass);border:1px solid var(--border);border-left:3px solid var(--primary);
font-size:13px;line-height:1.5;color:var(--text-sec);animation:slideUp .3s var(--ease-enter) both;
}
.explanation-card strong{color:var(--text);font-weight:700}
.explanation-card svg{width:15px;height:15px;stroke:var(--primary-soft);fill:none;vertical-align:-2px;margin-right:4px}
.powerups{display:flex;gap:8px;justify-content:center;margin-top:auto}
.powerup-btn{
flex:1;padding:8px 4px;border-radius:var(--r-chip);background:var(--glass);
border:1px solid var(--glass-border);text-align:center;font-size:10px;font-weight:600;
color:var(--text-sec);max-width:110px;min-height:44px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.powerup-btn:active:not(.used):not(.locked){transform:scale(0.95);border-color:var(--primary)}
.powerup-btn .pu-icon{display:block;margin:0 auto 3px;color:var(--primary-soft)}
.powerup-btn .pu-icon svg{width:18px;height:18px;stroke:currentColor;fill:none}
.powerup-btn .pu-cost{font-family:var(--font-serif);font-size:10px;color:var(--warn-text);font-weight:500}
.powerup-btn.locked{opacity:0.35;pointer-events:none}
.powerup-btn.used{opacity:0.28;pointer-events:none}
.combo-indicator{display:flex;align-items:center;justify-content:center;gap:6px;min-height:22px;margin-top:2px}
.combo-dot{width:8px;height:8px;border-radius:50%;background:var(--dot);transition:background .2s}
.combo-dot.active{background:var(--primary-soft)}
.combo-dot.hot{background:var(--lima)}
.combo-badge{padding:3px 11px;border-radius:var(--r-pill);font-family:var(--font-serif);font-size:13px;font-weight:500;background:var(--lima);color:#131C25;animation:springBounce .4s var(--ease-spring)}

.round-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(14,16,20,0.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.round-overlay-text{font-family:var(--font-serif);font-weight:500;font-size:44px;animation:roundOverlay .6s var(--ease) both;color:var(--primary-soft)}

/* ===== results ===== */
#results{justify-content:center;align-items:center;gap:14px;text-align:center;padding-bottom:40px}
.result-banner{width:100%;padding:26px 24px;border-radius:var(--r-giant);font-family:var(--font-serif);font-weight:500;font-size:30px;letter-spacing:-0.01em}
.result-banner.win{background:var(--ok-bg);border:1px solid rgba(6,163,122,0.35)}
.result-banner.win .hl{color:var(--lima-ink)}
.result-banner.draw{background:var(--card);border:1px solid var(--border);color:var(--primary-soft)}
.result-banner.loss{background:var(--danger-bg);border:1px solid rgba(220,47,91,0.3)}
.result-score-compare{display:flex;align-items:center;justify-content:center;gap:20px;font-family:var(--font-serif);font-size:40px;font-weight:500}
.result-score-compare .vs-x{font-size:15px;color:var(--text-ter);font-weight:600;font-family:var(--font-sans)}
.result-score-compare .me-score{color:var(--primary-soft)}
.result-score-compare .opp-score{color:var(--text-sec)}
.rewards-list{width:100%;text-align:left}
.reward-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.reward-row:last-child{border-bottom:none}
.reward-label{color:var(--text-sec);font-weight:500}
.reward-val{font-family:var(--font-serif);font-weight:500;color:var(--ok-text)}
.result-coins{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-serif);font-size:20px;font-weight:500;color:var(--warn-text)}
.result-coins svg{width:18px;height:18px;stroke:currentColor;fill:none}
.xp-section{width:100%}
.xp-label{font-size:12px;color:var(--text-sec);margin-bottom:5px;display:flex;justify-content:space-between}
.xp-bar-wrap{height:8px;background:var(--track);border-radius:8px;overflow:hidden}
.xp-bar{height:100%;border-radius:8px;background:var(--primary);transition:width 1s var(--ease)}
.level-up-flash{position:fixed;inset:0;background:rgba(104,123,234,0.28);display:flex;align-items:center;justify-content:center;z-index:999;font-family:var(--font-serif);font-weight:500;font-size:38px;color:var(--lima-ink);animation:fadeIn .3s var(--ease-enter);cursor:pointer;backdrop-filter:blur(4px)}
.result-actions{display:flex;flex-direction:column;gap:10px;width:100%}
.result-actions .btn-primary,.result-actions .btn-secondary{font-size:15px;padding:15px;width:100%}

.review-section{width:100%;text-align:left;margin-top:4px}
.review-toggle{width:100%;padding:14px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--glass-border);color:var(--primary-soft);font-weight:700;font-size:14px;text-align:center;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.review-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none}
.review-toggle:active{background:var(--glass-strong)}
.review-list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.review-item{padding:14px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--border)}
.review-q{font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.4}
.review-answer{padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.review-answer.correct-answer{background:var(--ok-bg);border:1px solid rgba(6,163,122,0.3);color:var(--ok-text)}
.review-answer.wrong-answer{background:var(--danger-bg);border:1px solid rgba(220,47,91,0.3);color:var(--danger-text)}
.review-answer.neutral{background:var(--glass);border:1px solid transparent;color:var(--text-ter)}
.review-explanation{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--glass);border-left:3px solid var(--primary);font-size:12px;line-height:1.5;color:var(--text-sec)}

/* ===== leaderboard ===== */
#leaderboard{gap:16px}
.lb-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;flex-wrap:nowrap;background:var(--glass);border-radius:var(--r-pill);border:1px solid var(--border);flex:0 0 auto;align-items:center;min-height:48px}
.lb-tab{padding:9px 15px;border-radius:var(--r-pill);background:transparent;border:none;font-size:12px;font-weight:600;color:var(--text-ter);white-space:nowrap;flex-shrink:0;min-height:40px}
.lb-tab:active{transform:scale(0.97)}
.lb-tab.active{background:var(--primary);color:#fff}
.lb-reset{text-align:center;font-size:12px;color:var(--text-ter);margin-bottom:4px}
.lb-list{display:flex;flex-direction:column;gap:8px}
.lb-entry{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-btn);background:var(--card);border:1px solid var(--border)}
.lb-entry.me{border-color:var(--primary);background:var(--primary-glow)}
.lb-entry.top1{border-color:rgba(220,255,121,0.4);background:var(--lima-bg)}
.lb-entry.top2{border-color:var(--glass-border)}
.lb-entry.top3{border-color:var(--glass-border)}
.lb-rank{width:26px;text-align:center;font-family:var(--font-serif);font-weight:500;font-size:15px;color:var(--text-sec)}
.lb-entry.top1 .lb-rank{color:var(--lima-ink)}
.lb-entry-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--card-2)}
.lb-entry-avatar img{width:100%;height:100%;object-fit:cover}
.lb-entry-info{flex:1;min-width:0}
.lb-entry-name{font-size:13px;font-weight:700}
.lb-entry-role{font-size:10px;color:var(--text-ter)}
.lb-entry-pts{font-family:var(--font-serif);font-size:15px;font-weight:500;color:var(--primary-soft);flex-shrink:0}
.lb-challenge-btn{padding:7px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:700;background:var(--glass);border:1px solid var(--glass-border);color:var(--primary-soft);cursor:pointer;flex-shrink:0;min-height:34px}
.lb-challenge-btn:active{transform:scale(0.95)}

/* ===== profile ===== */
#profile{align-items:center;gap:16px;text-align:center}
.profile-name{font-family:var(--font-serif);font-weight:500;font-size:24px;margin-top:10px;letter-spacing:-0.01em}
.profile-role{font-size:13px;color:var(--text-sec)}
.profile-rank{margin-top:4px}
.profile-level{width:100%;margin-top:8px}
.profile-level-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sec);margin-bottom:5px}
.profile-xp-bar{height:8px;background:var(--track);border-radius:8px;overflow:hidden;width:100%}
.profile-xp-fill{height:100%;border-radius:8px;background:var(--primary)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;margin-top:8px}
.stat-box{padding:16px 8px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--border);text-align:center}
.stat-val{font-family:var(--font-serif);font-size:22px;font-weight:500;color:var(--primary-soft)}
.stat-label{font-size:10px;color:var(--text-ter);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-top:3px}
.medals-section{width:100%;text-align:left;margin-top:4px}
.medals-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.medal{padding:11px 4px;border-radius:var(--r-chip);background:var(--card);border:1px solid var(--border);text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.medal svg{width:22px;height:22px;stroke:var(--primary-soft);fill:none}
.medal.locked{opacity:0.25;filter:grayscale(1)}
.medal-name{font-size:8px;font-weight:600;color:var(--text-ter);margin-top:4px;line-height:1.2}
.profile-photo-edit{position:absolute;bottom:0;right:0;width:30px;height:30px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--bg);color:#fff}
.profile-photo-edit svg{width:15px;height:15px;stroke:currentColor;fill:none}

/* ===== settings ===== */
#settings{gap:12px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--border-soft)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.setting-label svg{width:18px;height:18px;stroke:var(--text-sec);fill:none;flex-shrink:0}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--card-2);position:relative;cursor:pointer;transition:background .2s;border:none;min-height:28px;flex-shrink:0}
.toggle.on{background:var(--primary)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}

/* ===== bottom nav ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:center;z-index:100}
.bottom-nav.visible{display:flex}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){

function safeUrl(u){
  u=String(u==null?'':u).trim();
  if(!u)return '';
  // explicit allow-list for absolute URLs and inline images
  if(/^(https?:\/\/|data:image\/(png|jpe?g|gif|webp);base64,)/i.test(u))return u;

const QUESTIONS={
mercado:[
{q:"Quais são os quatro componentes que formam o valor da parcela mensal de um consórcio?",a:["Fundo comum, taxa de administração, fundo de reserva e seguro prestamista.","Fundo comum, juros remuneratórios, taxa de adesão e IOF.","Taxa de administração, juros de mora, fundo garantidor e seguro desemprego.","Amortização, juros compostos, taxa de administração e TR."],e:"A parcela do consórcio não possui juros. Ela é composta pelo fundo comum (poupança para a carta), taxa de administração, fundo de reserva (garantia para imprevistos) e seguro prestamista.",d:2},
{q:"Na política de crédito do Home Equity (Crédito com Garantia de Imóvel), qual é o limite máximo de LTV (Loan to Value) permitido para Casas e Apartamentos, respectivamente?",a:["Até 50% para Casas e até 60% para Apartamentos.","Até 60% para Casas e até 70% para Apartamentos.","Até 40% para Casas e até 50% para Apartamentos.","Até 70% para Casas e até 80% para Apartamentos."],e:"No Home Equity, o LTV varia conforme o tipo de imóvel: chega a até 60% para apartamentos, 50% para casas, 40% para salas comerciais e 30% para terrenos.",d:3},
{q:"No produto Auto Equity (Crédito com garantia de veículos), qual é o percentual máximo do valor do veículo que pode ser liberado como crédito (LTV sugerido)?",a:["Até 80% do valor do veículo.","Até 100% do valor do veículo.","Até 50% do valor do veículo.","Até 60% do valor do veículo."],e:"No Auto Equity, que é o refinanciamento onde o veículo fica como garantia, o crédito máximo liberado é de até 80% do valor do veículo.",d:1},
{q:"Para utilizar o FGTS na compra de um imóvel residencial através do Crédito Imobiliário, qual das regras abaixo é uma exigência obrigatória?",a:["Ter no mínimo 36 depósitos na conta do FGTS e não possuir financiamento ativo no SFH em nenhum lugar do país.","Ter no mínimo 12 depósitos na conta do FGTS e o imóvel deve ser obrigatoriamente novo.","O beneficiário precisa residir na cidade do imóvel há pelo menos 5 anos e ter no mínimo 24 depósitos.","Não há exigência de número mínimo de depósitos, desde que o cliente dê 20% de entrada em recursos próprios."],e:"O uso do FGTS exige no mínimo 36 depósitos, que o cliente não possua imóvel na cidade onde reside ou trabalha, e que não tenha financiamento ativo no Sistema Financeiro de Habitação (SFH).",d:2},
{q:"Qual é uma das principais vantagens para a empresa ao oferecer o Consignado Privado para seus funcionários (CLT)?",a:["A dívida fica atrelada exclusivamente ao CPF do funcionário e nunca ao CNPJ da empresa.","A empresa recebe uma porcentagem dos juros cobrados pelo banco na operação.","A empresa passa a ser a fiadora principal do funcionário perante o banco parceiro.","Os funcionários são obrigados a abrir conta corrente na corretora que ofereceu o crédito."],e:"Uma das maiores vantagens para o RH e para a empresa na adesão ao Consignado Privado é que a dívida do empréstimo fica no CPF do colaborador, sem trazer qualquer risco para o CNPJ.",d:1},
{q:"Como funciona a modalidade de 'Lance Embutido' no Consórcio?",a:["O consorciado utiliza parte do próprio valor da carta de crédito para potencializar o seu lance, descontando esse percentual do valor final.","O consorciado pega um empréstimo com a administradora para pagar o lance por fora, aumentando o valor da parcela.","O valor do lance é embutido e diluído nas parcelas restantes do grupo, sem reduzir o valor da carta de crédito.","É um lance pré-fixado pela administradora onde todos os participantes adimplentes dão obrigatoriamente o mesmo valor."],e:"No lance embutido, usa-se uma fatia do próprio crédito contratado para dar o lance, o que diminui o valor líquido a ser recebido no momento de utilizar a carta.",d:2},
{q:"Qual é o principal público-alvo do Seguro de Vida em Grupo e qual sua vantagem em relação ao seguro de vida individual?",a:["É destinado a empresas a partir de 2 funcionários, com custo geralmente inferior ao do seguro individual.","É destinado exclusivamente a grandes corporações (acima de 500 funcionários) e possui um custo mais elevado devido ao risco.","É um seguro obrigatório exclusivo para grupos familiares visando apenas a proteção de crédito imobiliário.","É destinado a autônomos que desejam formar um grupo de compra fechado para obter isenção de imposto de renda."],e:"O seguro de vida em grupo visa proteger sócios, colaboradores, terceiros e suas famílias em empresas a partir de 2 vidas, possuindo um custo inferior ao individual e ajudando na retenção de talentos.",d:1},
{q:"No processo de análise de Home Equity, certos tipos de imóveis NÃO são aceitos como garantia. Qual das alternativas apresenta apenas propriedades que são RECUSADAS neste produto?",a:["Imóveis rurais, galpões, imóveis operacionais, escolas e igrejas.","Apartamentos na planta, casas, terrenos de pessoa física e salas comerciais.","Salas comerciais, casas de praia, terrenos quitados e galpões de pequeno porte.","Imóveis urbanos, apartamentos residenciais, lotes averbados e casas em condomínio fechado."],e:"A política do Home Equity barra garantias frágeis ou difíceis de liquidar. Estão expressamente não aceitos: imóvel rural, galpões, imóveis operacionais, escolas e igrejas.",d:2},
{q:"No portfólio de Seguros, qual é o principal objetivo da solução conhecida como 'Seguro Fiança Locatícia'?",a:["Substituir a necessidade de um fiador e facilitar o processo de locação de imóveis.","Garantir o pagamento das parcelas de um financiamento habitacional caso o cliente fique desempregado.","Cobrir eventuais danos físicos e estruturais no imóvel que foram causados por desastres ambientais.","Fornecer uma linha de crédito para que o inquilino possa antecipar as taxas de condomínio do ano."],e:"O Seguro Fiança Locatícia serve especificamente para substituir a figura do fiador tradicional, garantindo o aluguel para o proprietário e trazendo mais facilidade para quem vai alugar.",d:1},
{q:"Quais são os três principais tipos de operações disponíveis na contratação do produto Consignado Público?",a:["Margem livre, Refinanciamento e Portabilidade.","Antecipação de recebíveis, Capital de giro e Home Equity.","Empréstimo com garantia de veículo, Financiamento e Consórcio.","Lance embutido, Saque-aniversário FGTS e Crédito pessoal sem garantia."],e:"O Consignado Público atua com três frentes principais de operação: Margem Livre (quando o cliente ainda tem parte dos 35% de limite disponível), Refinanciamento e Portabilidade de dívida.",d:2}
],
investimentos:[
{q:"O que é um consórcio de acordo com o material apresentado?",a:["Uma forma de compra planejada onde pessoas se unem para autofinanciar um objetivo comum.","Um empréstimo bancário com taxas de juros reduzidas para aquisição de bens.","Uma modalidade de financiamento onde o bem é alienado ao banco até a quitação.","Um investimento de curto prazo atrelado à taxa Selic."],e:"O consórcio é definido como uma forma de compra colaborativa e planejada para autofinanciamento de um objetivo comum (como aquisição de imóvel ou veículo), caracterizando-se pela ausência de juros.",d:1},
{q:"Quais são os quatro itens que compõem o valor da parcela mensal de um consórcio?",a:["Fundo comum, taxa de administração, fundo de reserva e seguro prestamista.","Amortização, juros, taxa de administração e IOF.","Fundo comum, taxa de juros, seguro obrigatório e comissão.","Lance embutido, fundo de reserva, juros e seguro prestamista."],e:"As parcelas do consórcio não possuem juros e são compostas exatamente por: Fundo Comum, Taxa de Administração, Fundo de Reserva e Seguro Prestamista.",d:2},
{q:"Quais são os dois tipos de lance mencionados para tentar antecipar a contemplação no consórcio?",a:["Lance fixo e lance livre.","Lance garantido e lance condicionado.","Lance embutido e lance parcelado.","Lance obrigatório e lance voluntário."],e:"O material especifica duas modalidades de lance: o Lance Fixo, predeterminado pela administradora, e o Lance Livre, que funciona como um leilão onde vence o maior percentual ofertado.",d:1},
{q:"Como funciona a estratégia de 'Lance Embutido' no consórcio?",a:["O consorciado utiliza parte do próprio crédito da carta para potencializar seu lance, sendo o valor descontado no recebimento.","O consorciado pega um empréstimo com a administradora para pagar o valor do lance.","O valor do lance é embutido e dividido nas parcelas restantes do grupo do consórcio.","O consorciado utiliza o saldo do FGTS para cobrir inteiramente o lance ofertado."],e:"No lance embutido, o consorciado utiliza um percentual do próprio crédito para dar o lance. Esse valor utilizado é descontado do valor total do crédito que ele receberá na contemplação.",d:2},
{q:"Em qual situação é válido utilizar os recursos do FGTS para o pagamento de um lance no consórcio?",a:["Apenas para consórcios de imóveis, de acordo com as regras da Caixa Econômica Federal.","Para consórcios de veículos novos e seminovos comerciais.","Para qualquer tipo de consórcio, desde que o cliente possua saldo disponível.","Apenas para consórcios de serviços ou financiamento de painéis solares."],e:"O uso de recursos do FGTS para pagamento de lances é válido exclusivamente para os consórcios de imóveis, seguindo as diretrizes da Caixa Econômica Federal.",d:2},
{q:"Sobre a utilização do crédito e a junção de cotas de consórcio, qual das afirmativas é verdadeira?",a:["É permitida a junção de cotas do mesmo produto, desde que todas estejam contempladas.","É permitida a junção de cotas de produtos diferentes, mesmo que não estejam contempladas.","A junção de cotas só é permitida exclusivamente para consórcios de automóveis.","Não é permitida a junção de cotas sob nenhuma hipótese nas administradoras parceiras."],e:"O material esclarece que é permitida a junção de cotas do mesmo produto, não importando a nomenclatura do grupo, com a condição de que todas as cotas envolvidas já estejam contempladas.",d:3},
{q:"Existe um tempo limite para o consorciado utilizar o crédito após ser contemplado?",a:["Não há limite de tempo; se não for utilizado, o recurso fica aplicado em um fundo lastreado em títulos públicos.","Sim, o crédito deve ser obrigatoriamente utilizado em até 90 dias após a contemplação.","Sim, o limite é de 1 ano, após o qual o consorciado perde definitivamente o direito à carta.","Não há limite de tempo, mas o valor da carta sofre uma depreciação mensal de 1%."],e:"Não há limite de tempo para a utilização do crédito. Caso o consorciado não utilize imediatamente, os recursos são aplicados e rendem em um fundo lastreado em títulos públicos.",d:2},
{q:"Um consorciado contemplado é obrigado a utilizar o valor total da carta de crédito para a compra de apenas um único bem?",a:["Não, o crédito não precisa ser utilizado de uma única vez e a mesma cota pode ser usada para comprar mais de um bem.","Sim, a regra principal do consórcio exige a aquisição de um único bem correspondente ao valor da cota.","Não, mas a compra fracionada só é permitida para consórcios de serviços e pequenas reformas.","Sim, exceto nos casos em que o consorciado faz a junção com outra cota do mesmo grupo."],e:"O crédito obtido através do consórcio não precisa ser gasto todo de uma só vez, sendo perfeitamente possível usar uma mesma cota contemplada para a compra de mais de um bem.",d:1},
{q:"Qual o propósito do 'Fundo de Reserva' embutido na parcela do consórcio?",a:["Funciona como garantia para cobrir imprevistos do grupo, como inadimplência, e o valor não utilizado é devolvido no encerramento.","É o montante principal utilizado para formar a carta de crédito e comprar o bem dos contemplados.","Corresponde ao lucro retido pela Administradora pela gestão e manutenção administrativa do grupo.","Trata-se de um seguro obrigatório destinado a cobrir as parcelas em caso de falecimento do consorciado."],e:"O Fundo de Reserva é um percentual voltado a cobrir imprevistos, como a inadimplência ou demandas jurídicas. Ao final do grupo, se esse valor não for gasto, ele é devolvido ao consorciado.",d:2},
{q:"Como o material exemplifica a estratégia de 'Alavancagem Patrimonial' utilizando o consórcio?",a:["Contemplar uma carta, comprar um imóvel e utilizar o valor do aluguel recebido para pagar a própria parcela do consórcio.","Vender várias cartas de consórcio antes da contemplação, cobrando ágio sobre os valores já pagos.","Pausar o pagamento das parcelas temporariamente para investir o dinheiro na bolsa de valores.","Utilizar exclusivamente lances embutidos de 100% para não precisar desembolsar valores de parcelas ao longo do grupo."],e:"A engenharia financeira (alavancagem patrimonial) explicada envolve contemplar a carta, adquirir o imóvel e alugá-lo, fazendo com que a renda do aluguel pague as parcelas do consórcio e ainda gere sobra, utilizando recursos de terceiros.",d:3}
],
compliance:[
{q:"Na análise de crédito para empresas (PME), quais são os principais motivos ligados à conformidade e histórico financeiro que geram recusa da operação?",a:["Vencidos, prejuízo e Bacen zerado, alavancagem, CNPJ comprado, alteração de atividade recente e problemas judiciais.","Faturamento acima de 50 milhões no último ano e falta de imóveis operacionais registrados.","Apenas a falta de um avalista com patrimônio líquido superior ao dobro do crédito solicitado.","Venda de produtos exclusivamente para pessoa física e ausência de máquina de cartão própria."],e:"Conforme as regras de Crédito para Empresas, motivos de recusa incluem Bacen zerado, CNPJ comprado, histórico de prejuízo, alavancagem e problemas judiciais.",d:2},
{q:"Para a utilização do FGTS na compra de um imóvel residencial, qual é a regra estipulada em relação à quantidade de depósitos e a financiamentos ativos?",a:["É necessário ter no mínimo 36 depósitos na conta FGTS e não possuir financiamento habitacional ativo no SFH em nenhum lugar do país.","É necessário ter 24 depósitos contínuos e não possuir mais de um financiamento ativo no SFH na mesma cidade.","É exigido apenas ter saldo suficiente, sem limite mínimo de depósitos, contanto que o imóvel seja novo.","É necessário ter 48 depósitos e o vendedor não pode ter utilizado o FGTS na compra daquele imóvel nos últimos cinco anos."],e:"As diretrizes exigem no mínimo 36 depósitos, nenhum financiamento SFH ativo no país e que o imóvel se enquadre nas regras do SFH.",d:3},
{q:"Dentro das regras regulatórias para uso do FGTS na aquisição de imóvel, qual a restrição sobre a posse prévia de propriedades pelo beneficiário?",a:["O beneficiário não pode ser proprietário de nenhum imóvel residencial na cidade onde trabalha ou reside, nem em municípios limítrofes.","O beneficiário pode ter até um imóvel na mesma cidade, desde que comprove que ele está alugado para terceiros.","É proibido possuir propriedades comerciais em qualquer estado, mas permite-se ter imóveis residenciais fora da cidade de residência.","Não há restrições sobre possuir outros imóveis, desde que o novo imóvel adquirido com FGTS passe a ser a residência principal."],e:"Para fins de compliance e regulação do FGTS, o comprador não pode possuir imóvel residencial na cidade em que reside, trabalha ou em cidades limítrofes.",d:2},
{q:"No contexto de seguro de vida em grupo, para quais categorias de trabalhadores o seguro é estritamente obrigatório por lei (e não apenas por convenção coletiva)?",a:["Construção civil e motoristas de transportes rodoviários.","Bares, restaurantes e indústrias em geral.","Metalúrgicas e empresas de vigilância patrimonial.","Apenas estagiários, jovens aprendizes e terceirizados de qualquer setor."],e:"Enquanto metalúrgicas, vigilantes e bares dependem de Convenção Coletiva de Trabalho (CCT), a lei obriga seguros de vida para profissionais da construção civil e motoristas rodoviários.",d:1},
{q:"Qual é a exigência regulatória específica em relação ao status tributário do veículo nas operações de Fin Auto e Auto Equity?",a:["O veículo oferecido como garantia não pode mais conter restrição tributária no sistema do Detran.","O veículo pode conter restrição tributária, desde que o banco parceiro emita uma carta de anuência assumindo o imposto.","A restrição tributária é permitida apenas para veículos com menos de 3 anos de fabricação.","Veículos com restrição tributária têm o LTV (Loan to Value) reduzido obrigatoriamente para 50%."],e:"O material especifica claramente nas condições de Fin Auto e Auto Equity que o veículo não pode mais conter restrição tributária no sistema do Detran para ser aceito na operação.",d:3},
{q:"Na jornada de contratação do Crédito com Garantia de Imóvel (Home Equity), em que momento o Aceite Bacen do proponente deve ser fornecido à mesa?",a:["Na etapa de Lead/Checklist, logo após a solicitação, para que o analista confira os documentos e faça o enquadramento técnico.","Na etapa de Desembolso, devendo ser assinado no cartório junto com o registro da alienação.","Apenas após a etapa de Laudo de Avaliação e Análise Jurídica completa do imóvel.","O Aceite Bacen não é necessário para Home Equity, sendo exclusivo para financiamentos de veículos leves."],e:"A linha do tempo (D+2) indica que a mesa recebe a solicitação e já exige o envio do checklist e do Aceite Bacen na fase inicial (Lead/Checklist) para a devida verificação.",d:2},
{q:"No que diz respeito ao compliance na contratação de Consignado Privado, quais são os requisitos comerciais básicos sobre a constituição e receita da empresa conveniada?",a:["A empresa deve ter no mínimo 2 anos da data de constituição e a sua receita deve ser advinda da iniciativa privada.","A empresa precisa estar constituída há no máximo 1 ano e apresentar receita majoritária advinda de licitações públicas.","Não há exigência mínima de tempo de constituição, desde que a empresa comprove ter pelo menos 50 funcionários registrados.","A empresa deve ter no mínimo 5 anos de constituição e capital aberto na Bolsa de Valores."],e:"As condições do Consignado Privado exigem 2 anos de data de constituição da empresa e que ela possua receita advinda da iniciativa privada.",d:1},
{q:"Qual documentação fiscal é obrigatória no checklist básico de Crédito Imobiliário para atestar a regularidade quando o comprador ou vendedor for Pessoa Jurídica (PJ)?",a:["CRF do FGTS e Certidão Conjunta da Receita Federal e INSS.","Declaração de Imposto de Renda Pessoa Física dos sócios e IPTU da sede da empresa quitado.","Certidão Negativa de Débitos Municipais e alvará de funcionamento válido para o ano corrente.","Apenas o Contrato Social consolidado, sendo dispensadas quaisquer certidões de regularidade tributária."],e:"O checklist básico para PJ exige a apresentação do CRF do FGTS e a Certidão conjunta (Receita Federal e INSS) para assegurar a regularidade da empresa envolvida na transação.",d:1},
{q:"Segundo as políticas de crédito do Home Equity, quais tipos de imóveis não são elegíveis e não podem ser aceitos como garantia na operação?",a:["Imóvel rural, galpões, imóvel operacional, escolas e igrejas.","Apartamentos padrão, casas em condomínio fechado e salas comerciais.","Terrenos em áreas urbanas regularizadas e lajes corporativas.","Apenas imóveis cujo LTV solicitado pela operação de crédito seja superior a 20%."],e:"O material de Home Equity aponta expressamente em 'Qualidade do cliente' os imóveis que não são aceitos: imóvel rural, galpões, imóvel operacional, escolas e igrejas.",d:1},
{q:"No contexto da regulação dos Consórcios, qual é a regra aplicável à utilização do FGTS para o pagamento de lances?",a:["O uso do FGTS é válido apenas para Consórcios de Imóveis, devendo respeitar as regras estabelecidas pela Caixa Econômica Federal (CEF).","É permitido utilizar o FGTS para consórcios de automóveis de passeio, desde que sejam veículos novos (zero km).","Pode ser utilizado para qualquer tipo de consórcio (veículos, bens ou imóveis), com limite de saque de até 30% do saldo total da conta.","O uso de FGTS é estritamente proibido para pagamentos de lances, sendo liberado apenas na modalidade de financiamento imobiliário direto."],e:"No material explicativo sobre consórcios, fica detalhado que o lance com FGTS é 'Válido para Consórcios de Imóveis, de acordo com as regras da CEF'.",d:2}
],
atendimento:[
{q:"Qual é o LTV (Loan-to-Value) máximo permitido para a garantia de um apartamento nas operações de Home Equity?",a:["Até 60%","Até 50%","Até 40%","Até 30%"],e:"A política de crédito estipula que apartamentos podem ter um LTV de até 60% do valor do imóvel.",d:1},
{q:"Quais tipos de imóveis NÃO são aceitos como garantia na modalidade de Home Equity?",a:["Imóvel rural, galpões, imóvel operacional, escolas e igrejas","Casa, apartamento e terrenos PF","Salas comerciais e escritórios","Terrenos PJ e apartamentos"],e:"A apresentação lista explicitamente imóvel rural, galpões, imóveis operacionais, escolas e igrejas como imóveis que não são aceitos.",d:1},
{q:"De acordo com a política de crédito para Home Equity, qual é o LTV máximo permitido para casas e salas comerciais, respectivamente?",a:["Até 50% para casas e até 40% para salas comerciais","Até 60% para casas e até 50% para salas comerciais","Até 40% para casas e até 30% para salas comerciais","Até 60% para casas e até 40% para salas comerciais"],e:"A política define LTV de até 50% para casas e até 40% para salas comerciais.",d:2},
{q:"Quem pode ser o proponente para um Crédito com Garantia de Imóvel (Home Equity)?",a:["Pessoa Física (PF) e Pessoa Jurídica (PJ), sendo permitidos múltiplos proponentes","Apenas Pessoa Física (PF)","Apenas Pessoa Jurídica (PJ) com mais de 2 anos de CNPJ","Apenas servidores públicos e aposentados"],e:"O perfil do cliente engloba tanto Pessoa Física quanto Pessoa Jurídica, e é possível ter múltiplos proponentes na operação.",d:2},
{q:"Na jornada de contratação, qual é o prazo estimado para a etapa de 'Laudo de avaliação e análise jurídica' após a etapa do Parceiro?",a:["D+7","D+2","D+5","D+3"],e:"A linha do tempo estima o prazo de D+7 para o Laudo de avaliação e análise jurídica.",d:3},
{q:"Qual é a principal característica dos prazos e taxas de juros no Crédito com Garantia de Imóvel?",a:["Prazos alongados com taxas de juros menores","Prazos curtos com taxas de juros menores","Prazos alongados com taxas de juros maiores","Prazos curtos sem a cobrança de juros"],e:"Por possuir a garantia real do imóvel, a modalidade oferece a vantagem de prazos alongados combinados com taxas de juros menores.",d:1},
{q:"O que é recomendado incluir em uma boa 'Defesa de Crédito' para aumentar as chances de aprovação da proposta?",a:["Informações detalhadas como empresa, cargo, tempo de admissão, patrimônio, carteira de investimentos e fontes de renda extra","Apenas a matrícula atualizada do imóvel e um comprovante de residência simples","Ocultar a finalidade do crédito para que a análise foque apenas no valor da garantia","Apenas o nome completo do cliente e a assinatura digital"],e:"Uma boa defesa de crédito, que pode aumentar a chance de aprovação em 30%, inclui justificar o motivo do crédito e fornecer detalhes sobre renda extra, patrimônio e vínculos empregatícios.",d:2},
{q:"Com base nos dados da ABECIP de 2024 na apresentação, como está dividido percentualmente o Sistema de Amortização dos contratos em carteira?",a:["TP com 56,1% e SAC com 43,9%","SAC com 56,1% e TP com 43,9%","TP com 50,0% e SAC com 50,0%","TP com 60,0% e SAC com 40,0%"],e:"Os dados de saldo em carteira demonstram que a Tabela Price (TP) representa 56,1% e o SAC 43,9% dos sistemas de amortização.",d:3},
{q:"Como funciona a composição de renda na etapa de Pré-análise do Home Equity?",a:["O sistema leva em conta a soma da renda de todos os participantes informados (múltiplos proponentes e cônjuges)","É considerada apenas a renda da pessoa em cujo nome o imóvel está registrado","Apenas a renda do proponente com o maior salário é contabilizada","A composição de renda não é analisada, pois apenas o valor do imóvel serve como garantia"],e:"O sistema automaticamente leva em conta a renda de todos os participantes e cônjuges, validando se a soma da renda é compatível com o valor solicitado.",d:2},
{q:"Quando ocorre o desembolso do recurso aprovado para o cliente na jornada do Home Equity?",a:["Em estimado D+3, mas apenas após o registro da garantia no Cartório de Imóveis, que pode levar até 30 dias","Imediatamente após a aprovação da análise jurídica, antes da assinatura do contrato","No mesmo dia da assinatura do contrato, de forma antecipada pelo parceiro","Junto com a emissão do laudo de avaliação do imóvel em D+7"],e:"O desembolso do recurso (estimado em D+3 nesta etapa final) ocorre somente após o registro da garantia no Cartório de Imóveis, cujo prazo pode se estender a até 30 dias após o protocolo.",d:3}
],
cambio:[
{q:"Quais são os bancos parceiros da Franq para operações de Crédito Imobiliário listados no material?",a:["Santander, Inter, Itaú e Bradesco.","Caixa, Banco do Brasil, Itaú e Nubank.","Santander, Bradesco, C6 Bank e Banco Bari.","Itaú, Creditas, Porto Bank e BV."],e:"O material indica que a Franq opera com Santander, Inter, Itaú e Bradesco para o Crédito Imobiliário.",d:1},
{q:"Quais são as condições máximas de prazo e comprometimento de renda estipuladas para o financiamento de imóveis residenciais?",a:["Prazo de até 420 meses e comprometimento de renda de até 35%.","Prazo de até 240 meses e comprometimento de renda de até 25%.","Prazo de até 360 meses e comprometimento de renda de até 30%.","Prazo de até 420 meses e comprometimento de renda de até 25%."],e:"Para residenciais, o prazo pode chegar a 420 vezes com comprometimento de até 35% da renda do cliente.",d:2},
{q:"No financiamento de terrenos, qual é a peculiaridade em relação aos parceiros bancários e seguros obrigatórios citada nas condições comerciais?",a:["É feito somente pelo Bradesco e exige apenas o seguro MIP, além do IOF.","É feito por todos os parceiros e exige seguros MIP e DFI obrigatórios.","É feito apenas pelo Itaú e não exige seguros obrigatórios.","É feito pelo Santander e Inter, exigindo os seguros MIP e DFI."],e:"O financiamento de terreno possui restrição de ser feito somente pelo Bradesco, exigindo apenas o seguro MIP e cobrança de IOF.",d:3},

{q:"Quais documentos compõem o 'Checklist I' essencial para a etapa de avaliação do imóvel?",a:["Matrícula do imóvel, espelho do IPTU, proposta de financiamento modelo Banco e DPS (declaração pessoal de saúde).","Matrícula do imóvel, holerites dos últimos 3 meses, certidão de casamento e proposta.","Contrato social, certidão conjunta, espelho do IPTU e matrícula do imóvel.","Matrícula do imóvel, laudo de vistoria prévio, fotos do imóvel e certidão negativa de débitos."],e:"O Checklist I de avaliação do imóvel exige especificamente a Matrícula, Espelho do IPTU (áreas do imóvel), Proposta do banco e a DPS.",d:2},

var state;
function defaultState(){
return{
name:"",role:"Personal Banker",avatar:"\u{1F9D1}\u200D\u{1F4BC}",photo:null,
level:1,xp:0,coins:50,totalPoints:0,
wins:0,gamesPlayed:0,
pvpPlayed:0,pvpWins:0,
hasPerfectMatch:false,hasComboX3:false,
streak:{count:0,lastDate:null,rewarded7:false},
settings:{theme:'light',sfx:true,music:false,vibration:true,notifications:true,privateProfile:false},
topicStats:{},
dailyMissions:[],dailyMissionDate:null,
dailyWins:0,dailyPlayed:0,dailyCorrects:0,dailyMaxCombo:0,dailyPerfects:0,
dailyAllComplete:false,
leaderboard:null,lbResetDate:null,
notified:{},sbUserId:null,
tutorialSeen:false
};
}
function mergeState(base,over){
if(!over||typeof over!=='object')return base;
var out=Object.assign({},base,over);
out.settings=Object.assign({},base.settings,over.settings||{});
out.streak=Object.assign({},base.streak,over.streak||{});
out.notified=Object.assign({},base.notified||{},over.notified||{});
if(out.tutorialSeen===undefined)out.tutorialSeen=false;
return out;
}
function applyTheme(t){
document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');
var m=document.querySelector('meta[name=theme-color]');
if(m)m.setAttribute('content',t==='dark'?'#131C25':'#F5F7FB');
}
function loadState(){
try{
var s=localStorage.getItem('franqQuizV3');
if(s){state=mergeState(defaultState(),JSON.parse(s));applyTheme(state.settings.theme);return true}
}catch(e){}
state=defaultState();
applyTheme(state.settings.theme);
return false;
}
function saveState(){
try{localStorage.setItem('franqQuizV3',JSON.stringify(state))}catch(e){}
syncToSupabase();
}
function syncToSupabase(){
if(!sb||!sbUser)return;
if(_syncTimer)clearTimeout(_syncTimer);
_syncTimer=setTimeout(function(){
sb.from('profiles').update({
  level:state.level,xp:state.xp,coins:state.coins,
  total_points:state.totalPoints,wins:state.wins,
  games_played:state.gamesPlayed,
  has_perfect_match:state.hasPerfectMatch,
  has_combo_x3:state.hasComboX3,
  max_combo:state.dailyMaxCombo||0,
  streak_count:state.streak?state.streak.count:0,
  streak_last_date:state.streak?state.streak.lastDate:null,
  settings:state.settings,tutorial_seen:state.tutorialSeen
}).eq('id',sbUser.id).then(function(res){
  // On sync failure, keep local as source of truth (loadProfileFromSupabase prefers max(local,server)
  // for monotonic counters on next boot, so a stale server write will not roll the player back).
  if(res&&res.error)console.warn('Sync error:',res.error);
});
},500);
}
async function loadProfileFromSupabase(){
if(!sb||!sbUser)return false;
var res=await sb.from('profiles').select('*').eq('id',sbUser.id).single();
if(res.error||!res.data)return false;
var p=res.data;
state.name=p.name;state.role=p.role;state.avatar=p.avatar;
state.photo=p.photo_url||null;
state.level=p.level;state.xp=p.xp;state.coins=p.coins;
state.totalPoints=p.total_points;state.wins=p.wins;
state.gamesPlayed=p.games_played;
state.hasPerfectMatch=p.has_perfect_match;
state.hasComboX3=p.has_combo_x3;
state.streak={count:p.streak_count,lastDate:p.streak_last_date,rewarded7:false};
state.settings=Object.assign({},defaultState().settings,p.settings||{});
state.tutorialSeen=p.tutorial_seen;
state.pvpPlayed=p.pvp_played||0;
state.pvpWins=p.pvp_wins||0;
state.sbUserId=sbUser.id;
// Merge local-only fields + guard against monotonic-counter rollback for the SAME user.
// Server does not store daily/mission/notified/local-leaderboard state, so restore those from
// the last local save; and never let a stale server row roll a counter backwards.
try{
  var ls=localStorage.getItem('franqQuizV3');
  if(ls){
    var local=JSON.parse(ls);
    if(local&&(local.sbUserId==null||local.sbUserId===sbUser.id)){
      ['xp','totalPoints','coins','wins','gamesPlayed','level','pvpPlayed','pvpWins'].forEach(function(k){
        if(typeof local[k]==='number'&&local[k]>(state[k]||0))state[k]=local[k];
      });
      ['dailyMissions','dailyMissionDate','dailyWins','dailyPlayed','dailyCorrects','dailyMaxCombo','dailyPerfects','dailyAllComplete','leaderboard','lbResetDate'].forEach(function(k){
        if(local[k]!==undefined&&local[k]!==null)state[k]=local[k];
      });
      if(local.streak&&local.streak.rewarded7)state.streak.rewarded7=true;
      state.notified=Object.assign({},local.notified||{},state.notified||{});
    }
  }
}catch(e){}
if(!state.notified)state.notified={};
// Load topic stats
var tsRes=await sb.from('topic_stats').select('*').eq('user_id',sbUser.id);
if(tsRes.data){
  state.topicStats={};
  tsRes.data.forEach(function(ts){
    state.topicStats[ts.topic_key]={points:ts.points,played:ts.played};
  });
}
saveStateLocal();
applyTheme(state.settings.theme);
return true;
}
function saveStateLocal(){try{localStorage.setItem('franqQuizV3',JSON.stringify(state))}catch(e){}}

async function persistMatchToSupabase(result,pointsEarned,coinsEarned){
if(!sb||!sbUser||!game)return;
try{
  // Insert match record
  await sb.from('matches').insert({
    user_id:sbUser.id,
    topic_key:game.topic,
    opponent_name:(game.opponent&&game.opponent.name)||'Oponente',
    player_score:game.playerScore,
    opponent_score:game.opponentScore,
    correct_count:game.correctCount,
    max_combo:game.maxCombo||0,
    result:result,
    points_earned:pointsEarned,
    coins_earned:coinsEarned
  });
  // Upsert topic stats
  var topicPts=state.topicStats[game.topic]?state.topicStats[game.topic].points:0;
  var topicPlayed=state.topicStats[game.topic]?state.topicStats[game.topic].played:0;
  await sb.from('topic_stats').upsert({
    user_id:sbUser.id,
    topic_key:game.topic,
    points:topicPts,
    played:topicPlayed
  },{onConflict:'user_id,topic_key'});
  // Refresh leaderboard views
  sb.rpc('refresh_leaderboards').then(function(){});
  // Check for achievement notifications
  checkAndCreateNotifications(result);
}catch(e){console.warn('Match persist error:',e)}
}

async function checkAndCreateNotifications(matchResult){
if(!sb||!sbUser)return;
if(!state.notified)state.notified={};
var notifs=[];
// Each achievement fires exactly once, gated by a persisted flag keyed on the achievement id.
// Because each threshold is a >= check gated by a one-time flag, it fires on the first match that
// crosses the threshold (using the full cumulative total) and never re-fires afterwards.
function award(id,title,body){
  if(state.notified[id])return;
  state.notified[id]=true;
  notifs.push({type:'achievement',title:title,body:body});
}
if(state.wins>=1)award('win1','🎯 Primeira Vitória!','Parabéns pela sua primeira vitória no Franq Quiz!');
if(state.wins>=5)award('win5','🔥 5 Vitórias!','Você já venceu 5 partidas. Continue assim!');
if(state.gamesPlayed>=10)award('played10','⭐ 10 Partidas!','Você completou 10 partidas. Dedicação!');
if(state.totalPoints>=500)award('points500','💎 500 Pontos!','Meio milhar de pontos. Impressionante!');
if(state.level>=5)award('level5','👑 Nível 5!','Você alcançou o nível Master Franq!');
if(state.hasPerfectMatch&&game&&game.correctCount===5)award('perfect','🏆 Partida Perfeita!','5/5 corretas! Você mandou muito bem!');

var audioCtx=null;

function _playOsc(freq,dur,type,gain,freqEnd){
try{
  type=type||'sine';gain=gain||0.12;dur=dur||100;
  var o=audioCtx.createOscillator();
  var g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  if(freqEnd)o.frequency.linearRampToValueAtTime(freqEnd,audioCtx.currentTime+dur/1000);
  g.gain.setValueAtTime(gain,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur/1000);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur/1000+0.05);
}catch(e){}
}

function playTone(freq,dur,type,gain,freqEnd){
if(!state||!state.settings||!state.settings.sfx)return;
if(!audioCtx)return;
if(audioCtx.state==='running'){
  _playOsc(freq,dur,type,gain,freqEnd);
}else{
  // Await resume then play
  audioCtx.resume().then(function(){
    _playOsc(freq,dur,type,gain,freqEnd);
  }).catch(function(){});
}
}

function selectQuestionsForMatch(topicKey){
var all=QUESTIONS[topicKey].slice();
var easy=shuffle(all.filter(function(q){return q.d===1}));
var med=shuffle(all.filter(function(q){return q.d===2}));
var hard=shuffle(all.filter(function(q){return q.d===3}));
var selected=[];
function pick(pool,count){
var c=0;
while(c<count&&pool.length>0){selected.push(pool.pop());c++}
}
pick(easy,2);
pick(med,2);
pick(hard,1);
while(selected.length<5){
if(med.length>0)selected.push(med.pop());
else if(easy.length>0)selected.push(easy.pop());
else if(hard.length>0)selected.push(hard.pop());
else break;
}
selected.sort(function(a,b){return a.d-b.d});
return selected;
}

// Seeded PRNG (mulberry32)
function seededRandom(seed){
return function(){
  seed|=0;seed=seed+0x6D2B79F5|0;
  var t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;
};
}
function seededShuffle(arr,rng){
var a=arr.slice();
for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
return a;
}
function selectQuestionsForMatchSeeded(topicKey,seed){
var rng=seededRandom(seed);
var all=QUESTIONS[topicKey].slice();
var easy=seededShuffle(all.filter(function(q){return q.d===1}),rng);
var med=seededShuffle(all.filter(function(q){return q.d===2}),rng);
var hard=seededShuffle(all.filter(function(q){return q.d===3}),rng);
var selected=[];
function pick(pool,count){var c=0;while(c<count&&pool.length>0){selected.push(pool.pop());c++}}
pick(easy,2);pick(med,2);pick(hard,1);
while(selected.length<5){
  if(med.length>0)selected.push(med.pop());
  else if(easy.length>0)selected.push(easy.pop());
  else if(hard.length>0)selected.push(hard.pop());
  else break;
}
selected.sort(function(a,b){return a.d-b.d});
return selected;
}
function pvpSeededShuffleForRound(arr,seed,roundIndex){
return seededShuffle(arr,seededRandom(seed*1000+roundIndex));
}

function initPvpPresence(){
if(!sb||!sbUser)return;
// Presence channel - track online users
pvpPresenceChannel=sb.channel('franq-presence',{config:{presence:{key:sbUser.id}}});
pvpPresenceChannel.on('presence',{event:'sync'},function(){
  var pState=pvpPresenceChannel.presenceState();
  pvpOnlineUsers=[];
  Object.keys(pState).forEach(function(key){
    if(key===sbUser.id)return;
    var presences=pState[key];
    if(presences&&presences.length>0)pvpOnlineUsers.push(presences[0]);
  });
});
pvpPresenceChannel.subscribe(function(status){
  console.log('Presence channel status:',status);
  if(status==='SUBSCRIBED'){
    // Honor the private-profile setting: stay invisible/unchallengeable when it is on.
    if(!(state.settings&&state.settings.privateProfile)){
      pvpPresenceChannel.track({
        userId:sbUser.id,name:state.name,role:state.role,
        avatar:state.avatar,photo:state.photo,level:state.level
      });
    }
  }
});

// User channel - receive challenge invitations
pvpUserChannel=sb.channel('pvp-user:'+sbUser.id);
pvpUserChannel.on('broadcast',{event:'challenge:invite'},function(payload){
  handleChallengeInvite(payload.payload);
});
pvpUserChannel.on('broadcast',{event:'challenge:accept'},function(payload){
  handleChallengeAccepted(payload.payload);
});
pvpUserChannel.on('broadcast',{event:'challenge:decline'},function(payload){
  handleChallengeDeclined(payload.payload);
});
pvpUserChannel.on('broadcast',{event:'challenge:cancel'},function(payload){
  dismissIncomingChallenge();
});
pvpUserChannel.subscribe();
}

function cleanupPvpPresence(){
if(pvpPresenceChannel){pvpPresenceChannel.untrack();sb.removeChannel(pvpPresenceChannel);pvpPresenceChannel=null}
if(pvpUserChannel){sb.removeChannel(pvpUserChannel);pvpUserChannel=null}
if(pvpMatchChannel){sb.removeChannel(pvpMatchChannel);pvpMatchChannel=null}
pvpOnlineUsers=[];
}

function getOnlineUsers(){
return pvpOnlineUsers.filter(function(u){return u.userId!==sbUser.id});
}

      challenger:{userId:sbUser.id,name:state.name,role:state.role,avatar:state.avatar,photo:state.photo,level:state.level}
