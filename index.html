function broadcastRoundResult(){
if(!pvpMatchChannel||!pvpMode)return;
pvpMatchChannel.send({type:'broadcast',event:'match:round-result',payload:{
  userId:sbUser.id,round:game.round,cumulativeScore:game.playerScore
}});
}

function clampScore(v){v=Number(v);if(!isFinite(v))return 0;return Math.max(0,Math.min(2000,v))}
function handleOpponentRoundResult(data){
if(!data||data.userId===sbUser.id)return;
// Only accept scores from the actual opponent, and clamp to a sane range (anti-spoof; full
// integrity requires server-side authority — noted in PROGRESS.md as out of scope for this file).
if(pvpOpponentInfo&&data.userId!==pvpOpponentInfo.userId)return;
game.opponentScore=clampScore(data.cumulativeScore);
var el=document.getElementById('oScore');
if(el)el.textContent=game.opponentScore;
}

function broadcastMatchFinished(){
if(!pvpMatchChannel||!pvpMode)return;
pvpMyFinished=true;
pvpMatchChannel.send({type:'broadcast',event:'match:finished',payload:{
  userId:sbUser.id,finalScore:game.playerScore,correctCount:game.correctCount,maxCombo:game.maxCombo
}});
if(pvpOpponentFinished){
  endMatch();
}else{
  // Show waiting overlay on results area
  showScreen('results');
  document.getElementById('results').innerHTML=
  '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px">'+
  '<div style="font-size:16px;font-weight:700">Aguardando oponente...</div>'+
  '<div style="font-size:13px;color:var(--text-sec)">Seu placar: '+game.playerScore+' pts</div>'+
  '<div class="spinner" style="width:32px;height:32px;border:3px solid var(--card-border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite"></div>'+
  '</div>';
  // Safety timeout 60s — scoped to THIS match so a later rematch can't be ended by a stale timer
  var matchIdSnapshot=pvpMatchId;
  if(pvpDisconnectTimer)clearTimeout(pvpDisconnectTimer);
  pvpDisconnectTimer=setTimeout(function(){
    pvpDisconnectTimer=null;
    if(pvpMatchId!==matchIdSnapshot)return;
    if(game&&game.ended)return;
    if(pvpMode&&!pvpOpponentFinished){
      pvpOpponentFinished=true;
      showToast('Oponente desconectou');
      endMatch();
    }
  },60000);
}
}

function handleOpponentFinished(data){
if(!data||data.userId===sbUser.id)return;
if(pvpOpponentInfo&&data.userId!==pvpOpponentInfo.userId)return;
pvpOpponentFinished=true;
var fs=clampScore(data.finalScore);
if(data.forfeit&&game){
  // Opponent quit/forfeited → the remaining player is credited a win regardless of scores
  game.opponentForfeited=true;
}
pvpOpponentFinalScore=fs;
if(game)game.opponentScore=fs;
if(pvpMyFinished){
  endMatch();
}
}

function cleanupPvpMatch(){
if(pvpDisconnectTimer){clearTimeout(pvpDisconnectTimer);pvpDisconnectTimer=null}
if(pvpReadyInterval){clearInterval(pvpReadyInterval);pvpReadyInterval=null}
if(pvpMatchChannel){sb.removeChannel(pvpMatchChannel);pvpMatchChannel=null}
pvpMode=false;pvpMyFinished=false;pvpOpponentFinished=false;
pvpOpponentFinalScore=0;pvpMatchId=null;pvpSeed=null;
pvpOpponentInfo=null;pvpReadyReceived=false;pvpTopicKey=null;
}

async function persistPvpMatch(result){
if(!sb||!sbUser||!pvpOpponentInfo)return;
// Snapshot match identity + scores now. A rematch (Revanche PvP) may create a NEW channel/id
// while these awaits are in flight; we must not clean up or overwrite the new match afterwards.
var matchIdSnapshot=pvpMatchId;
var oppSnapshot=pvpOpponentInfo;
var seedSnapshot=pvpSeed;
var topicSnapshot=game.topic;
var p1s=game.playerScore,p2s=game.opponentScore,p1c=game.correctCount;
// Persist regular-match/leaderboard row synchronously (reads live game before any rematch replaces it)
persistMatchToSupabase(result,p1s,0);
try{
  await sb.from('pvp_matches').insert({
    match_id:matchIdSnapshot,topic_key:topicSnapshot,
    player1_id:sbUser.id,player2_id:oppSnapshot.userId,
    player1_score:p1s,player2_score:p2s,
    player1_correct:p1c,
    winner_id:result==='win'?sbUser.id:result==='loss'?oppSnapshot.userId:null,
    status:'completed',seed:seedSnapshot
  });
  await sb.from('profiles').update({
    pvp_played:state.pvpPlayed||0,
    pvp_wins:state.pvpWins||0
  }).eq('id',sbUser.id);
}catch(e){console.warn('PvP persist error:',e)}
// Only clean up if this is still the current match (a rematch may already own new globals)
if(pvpMatchId===matchIdSnapshot)cleanupPvpMatch();
}

function generateLeaderboard(){

"Pedro Almeida","Fernanda Rocha","Lucas Mendes","Beatriz Ferreira","Thiago Souza",

var lb=names.map(function(n,i){

return{
name:n,avatar:opp?opp.avatar:OPPONENTS[i%OPPONENTS.length].avatar,
points:Math.floor(Math.random()*1800+100),isPlayer:false,
topicPoints:{}
};
});
var topicKeys=Object.keys(TOPICS_META);
lb.forEach(function(e){
topicKeys.forEach(function(t){e.topicPoints[t]=Math.floor(Math.random()*200+10)});
});

function getNextMonday(){
var d=new Date();d.setDate(d.getDate()+(7-d.getDay()+1)%7||7);d.setHours(0,0,0,0);
return d.getTime();
}
function buildLeaderboard(filter){
if(!state.leaderboard)generateLeaderboard();
var lb=state.leaderboard.map(function(e){return Object.assign({},e)});
var playerEntry={
name:state.name,avatar:state.avatar,
points:filter==='geral'?state.totalPoints:(state.topicStats[filter]?state.topicStats[filter].points:0)||0,
isPlayer:true,topicPoints:{}
};
Object.keys(TOPICS_META).forEach(function(t){
playerEntry.topicPoints[t]=state.topicStats[t]?state.topicStats[t].points:0;
});
if(filter!=='geral'){
lb.forEach(function(e){e.points=e.topicPoints[filter]||0});
playerEntry.points=(state.topicStats[filter]?state.topicStats[filter].points:0)||0;
}else{
playerEntry.points=state.totalPoints;
}
lb.push(playerEntry);
lb.sort(function(a,b){return b.points-a.points});
return lb.slice(0,20);
}

async function fetchLeaderboardFromSupabase(filter){
if(!sb)return null;
try{
  var entries=[];
  if(filter==='geral'){
    // Query profiles directly for freshest data
    var res=await sb.from('profiles').select('id,name,role,avatar,photo_url,level,total_points').order('total_points',{ascending:false}).limit(20);
    if(res.error)return null;
    entries=res.data.map(function(r){return{
      name:r.name,avatar:r.avatar,photo:r.photo_url,
      points:r.total_points,level:r.level,role:r.role,
      isPlayer:sbUser&&r.id===sbUser.id,userId:r.id
    }});
  }else{
    var res=await sb.from('topic_stats').select('user_id,topic_key,points,profiles(name,role,avatar,photo_url,level)').eq('topic_key',filter).order('points',{ascending:false}).limit(20);
    if(res.error)return null;
    entries=res.data.map(function(r){var p=r.profiles||{};return{
      name:p.name,avatar:p.avatar,photo:p.photo_url,
      points:r.points,level:p.level,role:p.role,
      isPlayer:sbUser&&r.user_id===sbUser.id,userId:r.user_id
    }});
  }
  // Add current player if not in the list
  var hasPlayer=entries.some(function(e){return e.isPlayer});
  if(!hasPlayer&&state.name){
    var playerPts=filter==='geral'?state.totalPoints:(state.topicStats[filter]?state.topicStats[filter].points:0)||0;
    entries.push({name:state.name,avatar:state.avatar,photo:state.photo,points:playerPts,level:state.level,role:state.role,isPlayer:true});
    entries.sort(function(a,b){return b.points-a.points});
    // Keep the player row even if they rank below the top 20 (so home/ranking never shows position 0)
    if(entries.length>20){
      var pIdx=entries.findIndex(function(e){return e.isPlayer});
      if(pIdx>=20){var pl=entries[pIdx];entries=entries.slice(0,19);entries.push(pl)}
      else entries=entries.slice(0,20);
    }
  }
  return entries;
}catch(e){return null}
}

async function doLogin(){
var email=(document.getElementById('loginEmail').value||'').trim();
var password=(document.getElementById('loginPassword').value||'').trim();
var err=document.getElementById('loginError');
var btn=document.getElementById('loginBtn');

if(!email){err.textContent='Por favor, insira seu email.';return}
if(!password||password.length<6){err.textContent='Senha deve ter pelo menos 6 caracteres.';return}
err.textContent='';
btn.disabled=true;btn.textContent=isSignupMode?'Criando...':'Entrando...';

try{
  if(!sb){
    // Fallback: no Supabase configured, use local mode
    if(!loadState()||!state.name){state=defaultState()}
    var name=(document.getElementById('loginName').value||'').trim()||email.split('@')[0];
    var role=(document.getElementById('loginRole').value||'').trim()||'Personal Banker';
    state.name=name;state.role=role;
    saveStateLocal();
    sfxClick();showScreen('home');
    if(!state.tutorialSeen)showTutorial();
    return;
  }

  var result;
  if(isSignupMode){
    var name=(document.getElementById('loginName').value||'').trim();
    var role=(document.getElementById('loginRole').value||'').trim()||'Personal Banker';
    if(!name){err.textContent='Por favor, insira seu nome.';btn.disabled=false;btn.textContent='Criar conta';return}
    result=await sb.auth.signUp({
      email:email,password:password,
      options:{data:{name:name,role:role}}
    });
    // If signup succeeded but no session (email confirmation enabled), try signing in
    if(!result.error&&result.data.user&&!result.data.session){
      result=await sb.auth.signInWithPassword({email:email,password:password});
    }
  }else{
    result=await sb.auth.signInWithPassword({email:email,password:password});
  }

  if(result.error){
    var msg=result.error.message;
    if(msg.includes('Invalid login'))msg='Email ou senha incorretos.';
    else if(msg.includes('already registered'))msg='Este email já está cadastrado. Faça login.';
    else if(msg.includes('valid email'))msg='Email inválido.';
    else if(msg.includes('at least'))msg='Senha deve ter pelo menos 6 caracteres.';
    else if(msg.includes('not confirmed'))msg='Email não confirmado. Verifique sua caixa de entrada.';
    err.textContent=msg;
    btn.disabled=false;btn.textContent=isSignupMode?'Criar conta':'Entrar';
    return;
  }

  sbUser=result.data.user;
  state=defaultState();
  var loaded=await loadProfileFromSupabase();
  if(!loaded&&isSignupMode){
    state.name=(document.getElementById('loginName').value||'').trim();
    state.role=(document.getElementById('loginRole').value||'').trim()||'Personal Banker';
  }
  saveStateLocal();
  sfxClick();showScreen('home');
  initPvpPresence();
  if(!state.tutorialSeen)showTutorial();
}catch(e){
  err.textContent='Erro de conexão. Tente novamente.';
}finally{
  btn.disabled=false;btn.textContent=isSignupMode?'Criar conta':'Entrar';
}
}

function toRoman(num){
var vals=[10,9,5,4,1];
var syms=['X','IX','V','IV','I'];
var r='';
for(var i=0;i<vals.length;i++){while(num>=vals[i]){r+=syms[i];num-=vals[i]}}
return r;
}

function startTimer(){
if(timerRAF)cancelAnimationFrame(timerRAF);
var lastTime=performance.now();
function timerLoop(now){
if(game.answered)return;
var dt=(now-lastTime)/1000;
if(dt>0.25)dt=0.25; // clamp so a backgrounded/hidden tab doesn't snap the timer to 0 on return
lastTime=now;
game.timeLeft=Math.max(0,game.timeLeft-dt);
var pct=(game.timeLeft/20)*100;
var bar=document.getElementById('timerBar');
var num=document.getElementById('timerNum');
var wrap=document.getElementById('timerWrap');
if(!bar)return;
bar.style.width=pct+'%';
var disp=game.timeLeft.toFixed(1);
if(disp!==game._timerText){game._timerText=disp;num.textContent=disp}
var band=pct>50?'green':pct>25?'yellow':'red';
if(band!==game._timerBand){
game._timerBand=band;
bar.className='timer-bar '+band;num.className='timer-number '+band;
if(wrap)wrap.classList.toggle('timer-danger',band==='red');
}
if(game.timeLeft<=3&&!game.timerWarnPlayed){game.timerWarnPlayed=true;sfxTimerWarn()}
if(game.timeLeft<=0){
game.answered=true;
timeUp();
return;
}
timerRAF=requestAnimationFrame(timerLoop);
}
timerRAF=requestAnimationFrame(timerLoop);
}

function timeUp(){
var prevCombo=game.combo;
game.combo=0;
highlightCorrect();
sfxWrong();vibrate([50,30,50]);
if(prevCombo>=3)sfxComboBreak();
spawnFxFlash('wrong');
showExplanation();
game.roundHistory.push({q:game.currentQuestion,chosen:-1,correctIdx:game.currentCorrectIdx,shuffled:game.currentShuffled,wasCorrect:false});
aiAnswer();
if(game.pvpMode)broadcastRoundResult();
game.nextRoundTimer=setTimeout(nextRound,2000);
}

function usePowerup(type){
if(game.answered)return;

game.timeLeft=Math.min(20,game.timeLeft+5);

sfxPowerup();vibrate(50);

function quitGame(){
if(timerRAF)cancelAnimationFrame(timerRAF);
if(game.nextRoundTimer){clearTimeout(game.nextRoundTimer);game.nextRoundTimer=null}
game.quit=true;
if(game.pvpMode){
  // Send an explicit forfeit so the opponent is credited a win; delay channel removal briefly
  // so the broadcast flushes before we tear the channel down.
  if(pvpMatchChannel){
    pvpMyFinished=true;
    try{pvpMatchChannel.send({type:'broadcast',event:'match:finished',payload:{
      userId:sbUser?sbUser.id:'',finalScore:game.playerScore,correctCount:game.correctCount,maxCombo:game.maxCombo||0,forfeit:true
    }});}catch(e){}
  }
  setTimeout(function(){cleanupPvpMatch()},600);
}
// Count the played match exactly once (endMatch owns the increment if a finish path already ran)
if(!game.ended){game.ended=true;state.gamesPlayed++;state.dailyPlayed++;saveState()}
showScreen('home');
}

function endMatch(){
if(game&&game.ended)return; // idempotent — reachable via finish/quit/disconnect races
game.ended=true;
if(timerRAF)cancelAnimationFrame(timerRAF);
if(game.nextRoundTimer){clearTimeout(game.nextRoundTimer);game.nextRoundTimer=null}
state.gamesPlayed++;state.dailyPlayed++;

// A forfeit by the opponent (PvP quit) is a win for the remaining player regardless of scores
var won=game.opponentForfeited?true:game.playerScore>game.opponentScore;
var draw=!game.opponentForfeited&&game.playerScore===game.opponentScore;
var perfect=game.correctCount===5;

if(game.pvpMode){state.pvpPlayed=(state.pvpPlayed||0)+1;if(won)state.pvpWins=(state.pvpWins||0)+1}

if(perfect){state.hasPerfectMatch=true;state.dailyPerfects++;vibrate([60,30,60,30,60,30,150])}
if(game.maxCombo>state.dailyMaxCombo)state.dailyMaxCombo=game.maxCombo;

var rewardPts=0,rewardCoins=0;
var rewards=[];

rewardPts+=50;rewardCoins+=10;
rewards.push({label:'Conclusão da partida',pts:50,coins:10});

if(won){
rewardPts+=50;rewardCoins+=5;
rewards.push({label:'Bônus de vitória',pts:50,coins:5});
state.wins++;state.dailyWins++;
var today=todayStr();
if(state.streak.lastDate){
var last=new Date(state.streak.lastDate);
var now=new Date(today);
var diff=Math.round((now-last)/(1000*60*60*24));
if(diff===1)state.streak.count++;
else if(diff>1){state.streak.count=1;state.streak.rewarded7=false}
}else{state.streak.count=1;state.streak.rewarded7=false}
state.streak.lastDate=today;
// Award the 7-day bonus only once per streak (not on every win while count sits at 7)

function animateScoreCountUp(elId,target,duration){
var el=document.getElementById(elId);
if(!el)return;
var start=performance.now();
function step(now){
var elapsed=now-start;
var progress=Math.min(elapsed/duration,1);
var eased=1-Math.pow(1-progress,3);
el.textContent=Math.round(target*eased);
if(progress<1)requestAnimationFrame(step);
}
requestAnimationFrame(step);
}

function spawnConfetti(){
if(reducedMotion())return;
var colors=['#687BEA','#8B9BFF','#DCFF79','#06A37A'];
for(var i=0;i<40;i++){
var el=document.createElement('div');
el.className='confetti-piece';
var size=4+Math.random()*8;
var x=Math.random()*100;
var delay=Math.random()*1.5;
var dur=2+Math.random()*1.5;
var rot=Math.random()*720;
var rotEnd=rot+360+Math.random()*360;
el.style.cssText='left:'+x+'vw;width:'+size+'px;height:'+size+'px;'+
'background:'+colors[Math.floor(Math.random()*colors.length)]+';'+
'border-radius:'+(Math.random()>0.5?'50%':'2px')+';'+
'animation:none;opacity:1;top:-10px;';
document.body.appendChild(el);
animateConfettiPiece(el,x,delay,dur,rot,rotEnd,size);
}
}
function animateConfettiPiece(el,x,delay,dur,rotStart,rotEnd,size){
var startTime=null;
var totalDur=(delay+dur)*1000;
function step(now){
if(!startTime)startTime=now;
var elapsed=now-startTime;
if(elapsed<delay*1000){requestAnimationFrame(step);return}
var t=Math.min((elapsed-delay*1000)/(dur*1000),1);
var y=-10+t*(window.innerHeight+20);
var gravity=t*t*50;
var sway=Math.sin(t*6)*20;
var rot=rotStart+(rotEnd-rotStart)*t;
var opacity=t>0.8?1-(t-0.8)/0.2:1;
el.style.transform='translateY('+y+'px) translateX('+sway+'px) rotate('+rot+'deg)';
el.style.opacity=opacity;
el.style.top='0px';
el.style.left=(x+sway/window.innerWidth*100)+'vw';
if(t<1){requestAnimationFrame(step)}else{el.remove()}
}
requestAnimationFrame(step);
}

var tabsHtml=tabs.map(function(t){

if(!input.files||!input.files[0])return;

var url=await uploadProfilePhoto(file);
if(url){renderProfile();renderHome()}
else{showToast('Erro ao enviar foto. Tente novamente.')}
}

function toggleTheme(el){
state.settings.theme=state.settings.theme==='dark'?'light':'dark';
applyTheme(state.settings.theme);
el.classList.toggle('on');
el.setAttribute('aria-checked',state.settings.theme==='dark'?'true':'false');
sfxClick();saveState();
}

function toggleSetting(key,el){
state.settings[key]=!state.settings[key];
el.classList.toggle('on');
el.setAttribute('aria-checked',state.settings[key]?'true':'false');
sfxClick();saveState();
// Apply the private-profile setting to presence immediately (track/untrack)
if(key==='privateProfile'&&pvpPresenceChannel&&sbUser){
  if(state.settings.privateProfile)pvpPresenceChannel.untrack();
  else pvpPresenceChannel.track({userId:sbUser.id,name:state.name,role:state.role,avatar:state.avatar,photo:state.photo,level:state.level});
}
}

async function loadChatHistory(){
if(!sb){chatMessages=localChatMessages.slice();chatLoaded=true;return}
try{
  var res=await sb.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(50);
  if(res.data&&res.data.length>0){
    chatMessages=res.data.map(function(m){
      var t=new Date(m.created_at);
      var timeStr=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
      return{
        from:sbUser&&m.user_id===sbUser.id?'me':m.user_name,
        photo:m.user_photo,text:m.message,time:timeStr,userId:m.user_id
      };
    });
  }else{
    chatMessages=localChatMessages.slice();
  }
  chatLoaded=true;
}catch(e){chatMessages=localChatMessages.slice();chatLoaded=true}
}

function subscribeToChatRealtime(){
if(!sb||chatSubscription)return;
chatSubscription=sb.channel('chat-realtime')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},function(payload){
    var m=payload.new;
    // Skip own messages (already added optimistically)
    if(sbUser&&m.user_id===sbUser.id)return;
    var t=new Date(m.created_at);
    var timeStr=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    chatMessages.push({
      from:m.user_name,
      photo:m.user_photo,text:m.message,time:timeStr,userId:m.user_id
    });
    if(currentScreen==='chat'&&chatTab==='chat'){
      var body=document.getElementById('chatBody');
      if(body){body.innerHTML=renderChatTab();body.scrollTop=body.scrollHeight}
    }
  })
  .subscribe();
}

function renderChatTab(){
return chatMessages.map(function(m){
var isMe=m.from==='me';
var avatarHtml='';
if(!isMe){
var pic=m.photo?safeUrl(m.photo):'';
avatarHtml='<div class="chat-msg-avatar">'+(pic?'<img src="'+pic+'" alt="'+esc(m.from)+'">':esc((m.from||'?').charAt(0)))+'</div>';
}
var nameHtml=isMe?'':'<div class="chat-bubble-name">'+esc(m.from)+'</div>';
return '<div class="chat-msg '+(isMe?'me':'them')+'">'+
avatarHtml+
'<div class="chat-bubble">'+
nameHtml+
esc(m.text)+
'<div class="chat-bubble-time">'+esc(m.time)+'</div>'+
'</div>'+
'</div>';
}).join('');
}

async function sendChatMsg(){
if(chatSending)return; // in-flight guard — avoids double-send on rapid Enter
var input=document.getElementById('chatInput');
if(!input)return;
var text=input.value.trim();
if(!text)return;
input.value='';

if(sb&&sbUser){
  chatSending=true;
  // Optimistic UI: add message locally immediately (keep a reference so we can roll it back)
  var now=new Date();
  var timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  var optimistic={from:'me',text:text,time:timeStr,userId:sbUser.id};
  chatMessages.push(optimistic);
  var body=document.getElementById('chatBody');
  if(body){body.innerHTML=renderChatTab();body.scrollTop=body.scrollHeight}
  // Persist to Supabase (realtime will not re-add because we check userId)
  try{
    var res=await sb.from('chat_messages').insert({
      user_id:sbUser.id,
      user_name:state.name,
      user_photo:state.photo,
      message:text
    });
    if(res&&res.error)throw res.error;
  }catch(e){
    console.warn('Chat send error:',e);
    // Roll back the optimistic bubble by reference (safe even if other messages arrived meanwhile)
    var idx=chatMessages.indexOf(optimistic);
    if(idx>=0)chatMessages.splice(idx,1);
    var b2=document.getElementById('chatBody');
    if(b2){b2.innerHTML=renderChatTab();b2.scrollTop=b2.scrollHeight}
    showToast('Falha ao enviar mensagem');
  }finally{chatSending=false}
}else{
  // Local fallback
  var now=new Date();
  var timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  chatMessages.push({from:'me',text:text,time:timeStr});
  renderChat();
  // Simulate a reply
  setTimeout(function(){
    var replies=['Boa! Vamos jogar depois?','Concordo totalmente!','Haha, mandou bem!',
    'Alguém quer fazer um desafio de Consórcios?','Estou subindo no ranking, cuidado!','Ótima dica, vou testar isso.'];
    var responder=shuffle(OPPONENTS.filter(function(o){return o.photo}));
    if(responder.length>0){
      chatMessages.push({from:responder[0].name,photo:responder[0].photo,text:replies[Math.floor(Math.random()*replies.length)],time:timeStr});
      renderChat();
    }
  },1500+Math.random()*2000);
}
}

// ====== INITIALIZATION ======
// Mobile audio unlock — must create AudioContext + play sound in same gesture
function _initAudioOnGesture(){
try{
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended'){
    audioCtx.resume();
  }
  // Play a near-silent oscillator to truly unlock on iOS/Android
  var o=audioCtx.createOscillator();
  var g=audioCtx.createGain();
  g.gain.value=0.001;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+0.01);
}catch(e){}
// Unlock only needs to happen once — stop spawning an oscillator on every tap for the page's life
document.removeEventListener('touchstart',_initAudioOnGesture);
document.removeEventListener('touchend',_initAudioOnGesture);
document.removeEventListener('click',_initAudioOnGesture);
}
document.addEventListener('touchstart',_initAudioOnGesture,{passive:true});
document.addEventListener('touchend',_initAudioOnGesture,{passive:true});
document.addEventListener('click',_initAudioOnGesture);
window.addEventListener('beforeunload',function(){
  if(pvpMode&&pvpMatchChannel){
    pvpMatchChannel.send({type:'broadcast',event:'match:finished',payload:{
      userId:sbUser?sbUser.id:'',finalScore:game?game.playerScore:0,correctCount:game?game.correctCount:0,forfeit:true
    }});
  }
});
loadState();
runSplash();
